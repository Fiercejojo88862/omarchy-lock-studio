<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="Omarchy Lock Studio — a live-preview lock screen customizer for Omarchy">
  <title>Omarchy Lock Studio</title>
  <desc>A hero graphic: the app's logo, a feature list, and a mock lock screen showing the clock, welcome line, face-unlock mark and password field it customizes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d16"/>
      <stop offset="0.55" stop-color="#0b0b12"/>
      <stop offset="1" stop-color="#101020"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.15" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#89b4fa" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#89b4fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.9" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#74c7ec" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#74c7ec" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161624"/>
      <stop offset="1" stop-color="#0b0b12"/>
    </linearGradient>
    <linearGradient id="lockBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9cc3ff"/>
      <stop offset="0.55" stop-color="#89b4fa"/>
      <stop offset="1" stop-color="#5b86e0"/>
    </linearGradient>
    <linearGradient id="shackle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9caff"/>
      <stop offset="1" stop-color="#7aa7f2"/>
    </linearGradient>

    <linearGradient id="card" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#20263e"/>
      <stop offset="0.5" stop-color="#161a2b"/>
      <stop offset="1" stop-color="#0e1020"/>
    </linearGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>

    <style>
      .ui { font-family: "Liberation Sans", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "JetBrainsMono Nerd Font", ui-monospace, monospace; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow1)"/>
  <rect width="1280" height="640" fill="url(#glow2)"/>

  <!-- ================= left: identity ================= -->
  <g transform="translate(72 64) scale(0.164)">
    <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#tile)"/>
    <rect x="2.5" y="2.5" width="507" height="507" rx="113.5" fill="none"
          stroke="#ffffff" stroke-opacity="0.07" stroke-width="5"/>
    <path d="M 176 240 V 198 a 80 80 0 0 1 160 0 V 240"
          fill="none" stroke="url(#shackle)" stroke-width="30" stroke-linecap="round"/>
    <rect x="128" y="228" width="256" height="184" rx="46" fill="url(#lockBody)"/>
    <rect x="128" y="228" width="256" height="184" rx="46" fill="none"
          stroke="#ffffff" stroke-opacity="0.16" stroke-width="2"/>
    <path d="M 190 288 l 44 32 l -44 32" fill="none" stroke="#0b0b12"
          stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="256" y="336" width="62" height="20" rx="10" fill="#0b0b12"/>
  </g>

  <text class="ui" x="176" y="122" font-size="42" font-weight="700">
    <tspan fill="#6c7086">Omarchy</tspan><tspan fill="#89b4fa" dx="12">Lock Studio</tspan>
  </text>
  <text class="ui" x="72" y="178" font-size="21" fill="#a6adc8">A live-preview lock screen customizer for Omarchy.</text>

  <!-- feature pills -->
  <g>
    <!-- row 1 -->
    <g>
      <rect x="72" y="222" width="180" height="44" rx="22" fill="#12121c" stroke="#26263a"/>
      <circle cx="94" cy="244" r="4.5" fill="#89b4fa"/>
      <text class="ui" x="110" y="250" font-size="15.5" fill="#cdd6f4">Clock &amp; date</text>
    </g>
    <g>
      <rect x="264" y="222" width="180" height="44" rx="22" fill="#12121c" stroke="#26263a"/>
      <circle cx="286" cy="244" r="4.5" fill="#89b4fa"/>
      <text class="ui" x="302" y="250" font-size="15.5" fill="#cdd6f4">Typography</text>
    </g>
    <g>
      <rect x="456" y="222" width="180" height="44" rx="22" fill="#12121c" stroke="#26263a"/>
      <circle cx="478" cy="244" r="4.5" fill="#89b4fa"/>
      <text class="ui" x="494" y="250" font-size="15.5" fill="#cdd6f4">Profile</text>
    </g>
    <!-- row 2 -->
    <g>
      <rect x="72" y="278" width="180" height="44" rx="22" fill="#12121c" stroke="#26263a"/>
      <circle cx="94" cy="300" r="4.5" fill="#89b4fa"/>
      <text class="ui" x="110" y="306" font-size="15.5" fill="#cdd6f4">Dev quotes</text>
    </g>
    <g>
      <rect x="264" y="278" width="180" height="44" rx="22" fill="#12121c" stroke="#26263a"/>
      <circle cx="286" cy="300" r="4.5" fill="#89b4fa"/>
      <text class="ui" x="302" y="306" font-size="15.5" fill="#cdd6f4">Now playing</text>
    </g>
    <g>
      <rect x="456" y="278" width="180" height="44" rx="22" fill="#12121c" stroke="#26263a"/>
      <circle cx="478" cy="300" r="4.5" fill="#89b4fa"/>
      <text class="ui" x="494" y="306" font-size="15.5" fill="#cdd6f4">Background</text>
    </g>
    <!-- row 3 -->
    <g>
      <rect x="72" y="334" width="180" height="44" rx="22" fill="#12121c" stroke="#26263a"/>
      <circle cx="94" cy="356" r="4.5" fill="#89b4fa"/>
      <text class="ui" x="110" y="362" font-size="15.5" fill="#cdd6f4">Text colour</text>
    </g>
    <g>
      <rect x="264" y="334" width="180" height="44" rx="22" fill="#12121c" stroke="#a6e3a1"/>
      <circle cx="286" cy="356" r="4.5" fill="#a6e3a1"/>
      <text class="ui" x="302" y="362" font-size="15.5" fill="#cdd6f4">Face unlock</text>
    </g>
    <g>
      <rect x="456" y="334" width="180" height="44" rx="22" fill="#12121c" stroke="#f9e2af"/>
      <circle cx="478" cy="356" r="4.5" fill="#f9e2af"/>
      <text class="ui" x="494" y="362" font-size="15.5" fill="#cdd6f4">Fingerprint</text>
    </g>
  </g>

  <text class="ui" x="72" y="428" font-size="15" fill="#7f849c">Live preview · a backup before every write · one-click restore to stock.</text>
  <text class="ui" x="72" y="456" font-size="15" fill="#7f849c">Edits only your own plugin clone — never /usr/share/omarchy.</text>

  <!-- proof points -->
  <g>
    <rect x="72" y="496" width="180" height="34" rx="17" fill="#0f0f18" stroke="#26263a"/>
    <text class="mono" x="162" y="518" text-anchor="middle" font-size="12.5" fill="#89b4fa">python3 · stdlib</text>
    <rect x="264" y="496" width="180" height="34" rx="17" fill="#0f0f18" stroke="#26263a"/>
    <text class="mono" x="354" y="518" text-anchor="middle" font-size="12.5" fill="#89b4fa">no root · no build</text>
    <rect x="456" y="496" width="180" height="34" rx="17" fill="#0f0f18" stroke="#26263a"/>
    <text class="mono" x="546" y="518" text-anchor="middle" font-size="12.5" fill="#89b4fa">backup first</text>
  </g>

  <text class="ui" x="72" y="576" font-size="13" fill="#585b70">MIT licensed · built on Omarchy (MIT), Quickshell (LGPL-3.0) and omaFace (MIT)</text>

  <!-- ================= right: mock lock screen ================= -->
  <g>
    <rect x="716" y="64" width="492" height="512" rx="30" fill="url(#card)"/>
    <clipPath id="cardClip">
      <rect x="716" y="64" width="492" height="512" rx="30"/>
    </clipPath>
    <g clip-path="url(#cardClip)">
      <circle cx="840" cy="150" r="110" fill="#6d8ff0" opacity="0.35" filter="url(#soft)"/>
      <circle cx="1120" cy="470" r="120" fill="#74c7ec" opacity="0.22" filter="url(#soft)"/>
      <circle cx="960" cy="330" r="120" fill="#cba6f7" opacity="0.12" filter="url(#soft)"/>
      <rect x="716" y="64" width="492" height="512" fill="#0b0b12" opacity="0.18"/>
    </g>
    <rect x="716.5" y="64.5" width="491" height="511" rx="29.5" fill="none"
          stroke="#ffffff" stroke-opacity="0.10"/>

    <!-- clock -->
    <text class="ui" x="962" y="202" text-anchor="middle" font-size="64" font-weight="700" fill="#ffffff">09:41</text>
    <text class="ui" x="962" y="236" text-anchor="middle" font-size="16" fill="#b9c0d6">Sunday, 2 November</text>

    <!-- profile -->
    <circle cx="962" cy="300" r="22" fill="#ffffff" opacity="0.12"/>
    <circle cx="962" cy="294" r="7" fill="#cdd6f4"/>
    <path d="M 950 311 a 12 12 0 0 1 24 0" fill="#cdd6f4"/>
    <text class="ui" x="962" y="354" text-anchor="middle" font-size="16" fill="#e6e9f5">Welcome back</text>

    <!-- face mark -->
    <g transform="translate(962 392)" stroke="#a6e3a1" stroke-width="2.4" fill="none" stroke-linecap="round">
      <path d="M -26 -18 h -6 a 4 4 0 0 0 -4 4 v 6"/>
      <path d="M 26 -18 h 6 a 4 4 0 0 1 4 4 v 6"/>
      <path d="M -26 18 h -6 a 4 4 0 0 1 -4 -4 v -6"/>
      <path d="M 26 18 h 6 a 4 4 0 0 0 4 -4 v -6"/>
      <circle cx="-7" cy="-3" r="2.2" fill="#a6e3a1" stroke="none"/>
      <circle cx="7" cy="-3" r="2.2" fill="#a6e3a1" stroke="none"/>
      <path d="M -6 8 q 6 6 12 0"/>
    </g>

    <!-- password field -->
    <rect x="776" y="440" width="372" height="56" rx="28"
          fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.18"/>
    <text class="ui" x="812" y="475" font-size="17" fill="#9aa2bd">Password</text>

    <!-- fingerprint glyph -->
    <g transform="translate(1098 468)" stroke="#9aa2bd" stroke-width="2.2" fill="none" stroke-linecap="round">
      <path d="M -12 -4 a 12 12 0 0 1 24 0"/>
      <path d="M -7 0 a 7 7 0 0 1 14 0 v 6"/>
      <path d="M -2 4 v 5"/>
    </g>

    <!-- rotating dev quote -->
    <text class="ui" x="962" y="546" text-anchor="middle" font-size="13" font-style="italic" fill="#8a90a8">“Talk is cheap. Show me the code.”</text>
  </g>
</svg>
